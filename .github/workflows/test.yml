name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: 跑单元测试
        run: python -m pytest -q --ignore=tests/e2e

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.0.3 playwright==1.60.0

      - name: 安装 Playwright Chromium(系统依赖 + 浏览器)
        run: |
          playwright install --with-deps chromium

      - name: 跑 e2e(Playwright)
        # pytest 自动 pick up tests/e2e/conftest.py 启 Flask 子进程 + 共享 Chromium
        # 失败时 --tb=short + -v 便于在 PR 评论里直接看哪条 assert 挂的
        run: python -m pytest tests/e2e/ -v --tb=short

      - name: 上传 e2e 产物(失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            tests/e2e/
          retention-days: 7
