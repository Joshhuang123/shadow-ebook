name: tests

on:
  push:
    branches: [main]
    # 只改文档 / 推广素材不跑测试 —— 那些文件碰不到任何运行时代码,
    # 跑一遍只是白等两分钟(还多收一封邮件)。
    paths-ignore:
      - '**/*.md'
      - 'promo/**'
      - 'docs/**'
  pull_request:
    # PR 上也忽略同样的路径,免得改个 README 也要等 CI
    paths-ignore:
      - '**/*.md'
      - 'promo/**'
      - 'docs/**'

# 连着推好几次,只跑最后一轮 —— 中间的自动取消。
# GitHub 只给「失败的 run」发失败通知,被取消的不发,
# 所以这一条直接解决「推一次收一封邮件」的问题。
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          # Pillow 是「占位封面」和「扫描 PDF 识别」的实现依赖。
          # requirements.txt 里它是可选的(没装也能跑,只是这两种格式
          # 明确报「服务器缺少解析组件」),但单元测试要真的验这两条路,
          # 所以测试环境必须装 —— 不装就是 tests/test_book_formats.py
          # 那两条一直红。
          pip install "Pillow==11.1.0"
      - name: 跑单元测试
        run: python -m pytest -q --ignore=tests/e2e

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.0.3 playwright==1.60.0

      - name: 安装 Playwright Chromium(系统依赖 + 浏览器)
        run: |
          playwright install --with-deps chromium

      - name: 跑 e2e(Playwright)
        # pytest 自动 pick up tests/e2e/conftest.py 启 Flask 子进程 + 共享 Chromium
        # 失败时 --tb=short + -v 便于在 PR 评论里直接看哪条 assert 挂的
        run: python -m pytest tests/e2e/ -v --tb=short

      - name: 上传 e2e 产物(失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            tests/e2e/
          retention-days: 7
