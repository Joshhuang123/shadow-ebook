<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/components.css">
    <script src="/js/dispatcher.js"></script>
<script src="/theme.js"></script>
<script src="/sync.js"></script>
    <script src="/a11y.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>学习统计 - Shadow Ebook</title>
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Shadow Ebook">
    <meta name="theme-color" content="#B86F4D">
    <link rel="stylesheet" href="/styles/pages/stats.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-brand">
            <div class="logo">📖</div>
            <span>Shadow Ebook</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">电子书</a>
            <a href="/tutor" class="nav-link">跟读学习</a>
            <a href="/grammar" class="nav-link">语法学习</a>
        </div>
    <button id="themeBtn" class="theme-btn" data-action="cycleTheme">&#xD83D;&#xDD0C;</button>
        </nav>

    <div class="main-container">
        <div class="hero">
<h1 class="hero-title">📊 学习统计</h1>
            <p class="hero-subtitle">记录你的每一步成长</p>
        </div>

        <!-- 主要统计卡片 -->
        <div class="stats-grid" id="stats-grid">
            <!-- 动态填充 -->
        </div>

        <!-- 词汇量测试 -->
        <div class="chart-section" id="vocab-test-section">
            <div class="section-title">📚 词汇量测试</div>
            <div id="vocab-test-content">
                <p class="vocab-test-intro">测试你的词汇水平，获得个性化书单推荐</p>
                <button class="btn btn-primary" data-action="startVocabTest">开始测试</button>
            </div>
        </div>

        <!-- 词汇量测试题目 -->
        <div class="chart-section hidden" id="vocab-test-question">
            <div class="section-title">📚 词汇量测试</div>
            <div class="vocab-test-progress" id="vocab-test-progress">1 / 20</div>
            <div class="vocab-test-question" id="vocab-test-q">Which word means "重要的"?</div>
            <div class="vocab-test-options" id="vocab-test-options">
                <!-- 选项 -->
            </div>
        </div>

        <!-- 书单推荐 -->
        <div class="chart-section hidden" id="book-rec-section">
            <div class="section-title">📖 推荐书单</div>
            <div class="book-rec-level" id="book-rec-level">你的词汇水平: 初级 (500-1000词)</div>
            <div id="interest-filter">
                <p class="interest-filter-title">兴趣筛选：</p>
                <div class="interest-tags" id="interest-tags">
                    <span class="interest-tag" data-interest="all" data-action="setInterest" data-arg="all">全部</span>
                    <span class="interest-tag" data-interest="adventure" data-action="setInterest" data-arg="adventure">冒险</span>
                    <span class="interest-tag" data-interest="fantasy" data-action="setInterest" data-arg="fantasy">奇幻</span>
                    <span class="interest-tag" data-interest="school" data-action="setInterest" data-arg="school">校园</span>
                    <span class="interest-tag" data-interest="mystery" data-action="setInterest" data-arg="mystery">悬疑</span>
                    <span class="interest-tag" data-interest="history" data-action="setInterest" data-arg="history">历史</span>
                    <span class="interest-tag" data-interest="science" data-action="setInterest" data-arg="science">科普</span>
                </div>
            </div>
            <div class="book-rec-list" id="book-rec-list">
                <!-- 推荐书籍 -->
            </div>
            <button class="btn btn-secondary" data-action="retestVocab">重新测试</button>
        </div>

        <!-- 学习时长图表 -->
        <div class="chart-section">
            <div class="section-title">📈 近7天学习时长</div>
            <div class="bar-chart" id="time-chart">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- 掌握进度 -->
        <div class="chart-section">
            <div class="section-title">🎯 掌握进度</div>
            <div class="progress-section" id="progress-section">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- 重置按钮 -->
        <div class="reset-actions">
            <button class="reset-btn" data-action="resetStats">🗑️ 重置所有数据</button>
        </div>
    </div>

    <script src="/js/stats.js"></script>
</body>
</html>
