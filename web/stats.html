<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/icons.css">
    <link rel="stylesheet" href="/styles/components.css">
    <script src="/js/dispatcher.js"></script>
<script src="/theme.js"></script>
<script src="/sync.js"></script>
    <script src="/a11y.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>学习统计 - 影子电子书</title>
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="影子电子书">
    <meta name="theme-color" content="#B86F4D">
    <link rel="stylesheet" href="/styles/pages/stats.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-brand">
            <div class="logo"><span class="ico ico-book" aria-hidden="true"></span></div>
            <span>影子电子书</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link"><span class="ico ico-book" aria-hidden="true"></span>电子书</a>
            <a href="/tutor" class="nav-link"><span class="ico ico-mic" aria-hidden="true"></span>跟读学习</a>
            <a href="/grammar" class="nav-link"><span class="ico ico-quote" aria-hidden="true"></span>语法学习</a>
            <a href="/stats" class="nav-link active"><span class="ico ico-chart" aria-hidden="true"></span>统计</a>
            <a href="/parent" class="nav-link nav-link-parent"><span class="ico ico-lock" aria-hidden="true"></span>家长</a>
        </div>
    <button id="themeBtn" class="theme-btn" data-action="cycleTheme"><span class="ico ico-moon" aria-hidden="true"></span></button>
        </nav>

    <div class="main-container">
        <div class="page-head">
            <p class="page-head-eyebrow"><span class="ico ico-chart" aria-hidden="true"></span>成长记录</p>
            <h1 class="page-head-title">学习统计</h1>
            <p class="page-head-sub">记录你的每一步成长</p>
        </div>

        <!-- 这一页唯一的视觉焦点(照设计稿):连续学习天数大数字。
             原来 6 个等大卡片并排,没有焦点 —— 违反 DESIGN.md「每页只能有一个视觉焦点」。 -->
        <section class="streak-hero" aria-labelledby="streak-hero-label">
            <div class="streak-hero-crown" aria-hidden="true"><span class="ico ico-fire ico--lg" aria-hidden="true"></span></div>
            <div class="streak-hero-value" id="streak-value">0</div>
            <h2 class="streak-hero-label" id="streak-hero-label">连续学习天数</h2>
            <p class="streak-hero-note" id="streak-note">今天读一点点,也算数</p>
        </section>

        <!-- 学习时长图表 -->
        <div class="chart-section">
            <div class="section-title"><span class="ico ico-trend" aria-hidden="true"></span>近7天学习时长</div>
            <div class="bar-chart" id="time-chart">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- 词汇量测试 -->
        <div class="chart-section" id="vocab-test-section">
            <div class="section-title"><span class="ico ico-pencil" aria-hidden="true"></span>词汇量测试</div>
            <div id="vocab-test-content">
                <p class="vocab-test-intro">测试你的词汇水平，获得个性化书单推荐</p>
                <button class="btn btn-primary" data-action="startVocabTest">开始测试</button>
            </div>
        </div>

        <!-- 词汇量测试题目 -->
        <div class="chart-section hidden" id="vocab-test-question">
            <div class="section-title"><span class="ico ico-pencil" aria-hidden="true"></span>词汇量测试</div>
            <div class="vocab-test-progress" id="vocab-test-progress">1 / 20</div>
            <div class="vocab-test-question" id="vocab-test-q">Which word means "重要的"?</div>
            <div class="vocab-test-options" id="vocab-test-options">
                <!-- 选项 -->
            </div>
        </div>

        <!-- 书单推荐 -->
        <div class="chart-section hidden" id="book-rec-section">
            <div class="section-title"><span class="ico ico-book" aria-hidden="true"></span>推荐书单</div>
            <div class="book-rec-level" id="book-rec-level">你的词汇水平: 初级 (500-1000词)</div>
            <div id="interest-filter">
                <p class="interest-filter-title">兴趣筛选：</p>
                <div class="interest-tags" id="interest-tags">
                    <span class="interest-tag" data-interest="all" data-action="setInterest" data-arg="all">全部</span>
                    <span class="interest-tag" data-interest="adventure" data-action="setInterest" data-arg="adventure">冒险</span>
                    <span class="interest-tag" data-interest="fantasy" data-action="setInterest" data-arg="fantasy">奇幻</span>
                    <span class="interest-tag" data-interest="school" data-action="setInterest" data-arg="school">校园</span>
                    <span class="interest-tag" data-interest="mystery" data-action="setInterest" data-arg="mystery">悬疑</span>
                    <span class="interest-tag" data-interest="history" data-action="setInterest" data-arg="history">历史</span>
                    <span class="interest-tag" data-interest="science" data-action="setInterest" data-arg="science">科普</span>
                </div>
            </div>
            <div class="book-rec-list" id="book-rec-list">
                <!-- 推荐书籍 -->
            </div>
            <button class="btn btn-secondary" data-action="retestVocab">重新测试</button>
        </div>

        <!-- 其余指标:降级成紧凑小卡,只作背景信息,不再和上面的焦点抢注意力 -->
        <div class="stats-grid stats-grid--minor" id="stats-grid">
            <!-- 动态填充 -->
        </div>

        <!-- 掌握进度 -->
        <div class="chart-section">
            <div class="section-title"><span class="ico ico-target" aria-hidden="true"></span>掌握进度</div>
            <div class="progress-section" id="progress-section">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- 重置按钮 -->
        <div class="reset-actions">
            <button class="reset-btn" data-action="resetStats"><span class="ico ico-trash" aria-hidden="true"></span>重置所有数据</button>
        </div>
    </div>

    <script src="/js/stats.js"></script>
</body>
</html>
